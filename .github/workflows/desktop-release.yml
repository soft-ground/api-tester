# Build the desktop installers for Windows, Linux, and macOS, and attach them to a GitHub Release.
#
# Trigger by pushing a tag like `desktop-v0.1.0` (kept separate from the web/server `v*` tags that
# drive the Docker images, since the desktop app has its own version). `workflow_dispatch` builds
# the installers without publishing, so the artifacts can be downloaded for testing.
#
# Each OS/arch is built on its own native runner, because electron-builder, the Prisma query
# engine, and the embedded Postgres binary are all host-specific (npm only installs the
# optionalDependency Postgres binary matching the runner's os+cpu):
#   windows-latest -> NSIS .exe (x64)
#   ubuntu-latest  -> .AppImage (x86_64)
#   macos-14       -> two dmgs: arm64 (Apple Silicon, native) + x64 (Intel, cross-built here
#                    because GitHub retired the Intel macos-13 runners)
# Builds are UNSIGNED (no certificate configured) — Windows shows a dismissible SmartScreen
# prompt, macOS needs a right-click -> Open (Gatekeeper). See milestone 6 for warning-free
# distribution (code signing + notarization).
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

permissions:
  contents: write # create the release and upload the installer assets

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 (Apple Silicon) builds BOTH mac arches — arm64 natively and x64 by cross-target
        # — because GitHub has retired the Intel macos-13 runners, so an Intel-native job just
        # queues forever. The x64 embedded-Postgres binary is fetched explicitly for the x64 dmg.
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build server
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install & build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Windows/Linux: one native installer. `npm run dist` = build + prep:server + electron-builder.
      - name: Package the host-OS installer (prunes the server first)
        if: runner.os != 'macOS'
        working-directory: desktop
        run: npm run dist
        env:
          # Unsigned builds: don't let electron-builder hunt for a signing identity (Windows
          # Authenticode / macOS codesign).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # macOS: build both arm64 (native) and x64 (cross) dmgs on this Apple-Silicon runner.
      # embedded-postgres ships a per-arch Postgres binary; npm only installed the arm64 one, so
      # fetch the darwin-x64 binary too (electron-builder then bundles each arch's dmg with the
      # matching one via its own os/cpu filtering). Version is pulled from embedded-postgres's own
      # optionalDependencies so it always matches. A direct file require() sidesteps the package's
      # restrictive "exports" field.
      - name: Add the Intel (x64) Postgres binary for the cross-arch mac build
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          ver=$(node -p "require('./node_modules/embedded-postgres/package.json').optionalDependencies['@embedded-postgres/darwin-x64']")
          echo "Installing @embedded-postgres/darwin-x64@${ver}"
          npm install "@embedded-postgres/darwin-x64@${ver}" --no-save --cpu=x64 --os=darwin --force --no-audit --no-fund

      - name: Package the macOS installers (x64 + arm64)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run build && npm run prep:server && npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Installers + electron-updater metadata (latest*.yml) + *.blockmap (differential updates).
      # Each runner only produces its own OS's files, so the cross-OS globs simply match nothing there.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error

  # Gather every OS's artifacts and attach them to the release in a single step, so the three
  # build jobs don't race to create/update the release concurrently.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Attach installers + update metadata to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
