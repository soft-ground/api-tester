server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow large spec uploads (OpenAPI import, etc.)
  client_max_body_size 25m;

  # Backend API proxy: /api/* → the server container
  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Hashed static assets (assets/*) get a new filename when content changes, so long-term caching is safe
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA routing: fall back to index.html when no static file matches.
  # Never cache index.html (if it holds an old asset hash after a redeploy,
  # it would keep loading the old app version).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
