# electron-builder config for an UNSIGNED desktop build.
# Produces a Windows installer (nsis) + portable exe. No code-signing certificate is
# configured, so the artifacts are unsigned (they run locally; downloaded copies may show a
# dismissible SmartScreen / Gatekeeper prompt — see README).
appId: com.softground.apitester
productName: API Tester

# Update feed for electron-updater: it reads latest.yml + the installer from this repo's GitHub
# Releases. Declaring it here also makes electron-builder emit latest.yml during the build. The
# actual upload is done by the CI workflow (softprops/action-gh-release), not electron-builder.
publish:
  provider: github
  owner: soft-ground
  repo: api-tester

directories:
  output: release

# asar is disabled: embedded-postgres resolves its postgres/initdb binaries via
# import.meta.url, which points inside app.asar even when the package is asar-unpacked
# (an ESM/asar gap), so spawning them fails with ENOENT. Keeping everything as real files
# on disk makes path resolution and child-process spawning work reliably. The tradeoff is
# a few more files / marginally slower startup — fine for a spawn-heavy desktop tool.
asar: false

files:
  - dist/**/*        # compiled Electron main + preload
  - package.json

# Real files on disk (outside the asar) that the spawned child processes need: the built server
# + its node_modules (Nest, Prisma client + query engine), the prisma CLI and migrations, and
# the web build the server serves as the UI. The server bits come from `staging/server`, a
# production-only tree assembled by `scripts/prep-server.mjs` (npm ci --omit=dev) so the installer
# excludes build/test-only devDependencies — run `npm run prep:server` before packaging.
extraResources:
  - from: staging/server/dist
    to: server/dist
  - from: staging/server/node_modules
    to: server/node_modules
  - from: staging/server/prisma
    to: server/prisma
  - from: staging/server/package.json
    to: server/package.json
  - from: ../web/dist
    to: web

# App icon (generated from web/public/favicon.svg — see assets/). buildResources default (build/)
# is gitignored here, so the icons live in assets/ and are referenced explicitly per platform.
win:
  icon: assets/icon.ico
  # Installer only. The portable target was dropped: it re-extracts the whole ~490 MB app to a
  # temp dir on every launch (slow), and its self-extractor stub proved flaky for this
  # spawn-heavy, no-asar app. The NSIS installer installs to a stable folder and is reliable.
  target:
    - nsis
nsis:
  # Space-free artifact name so the file on disk, latest.yml's `url`, and the uploaded release
  # asset all match. GitHub rewrites spaces in asset filenames (to dots), which would otherwise
  # break electron-updater (it fetches the exact url latest.yml records).
  artifactName: API-Tester-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Built per-arch on its native runner: macos-13 (Intel) emits an x64 dmg (with the darwin-x64
# Postgres binary), macos-14 (Apple Silicon) an arm64 dmg. The ${arch} in the name keeps the two
# dmgs (and their blockmaps) from colliding as release assets. Unsigned (Gatekeeper prompt on
# first launch); warning-free needs signing + notarization.
mac:
  icon: assets/icon.png
  target: dmg
  artifactName: API-Tester-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
linux:
  icon: assets/icon.png
  target: AppImage
