# electron-builder config for an UNSIGNED desktop build.
# Produces a Windows installer (nsis) + portable exe. No code-signing certificate is
# configured, so the artifacts are unsigned (they run locally; downloaded copies may show a
# dismissible SmartScreen / Gatekeeper prompt — see README).
appId: com.softground.apitester
productName: API Tester

directories:
  output: release

# asar is disabled: embedded-postgres resolves its postgres/initdb binaries via
# import.meta.url, which points inside app.asar even when the package is asar-unpacked
# (an ESM/asar gap), so spawning them fails with ENOENT. Keeping everything as real files
# on disk makes path resolution and child-process spawning work reliably. The tradeoff is
# a few more files / marginally slower startup — fine for a spawn-heavy desktop tool.
asar: false

files:
  - dist/**/*        # compiled Electron main + preload
  - package.json

# Real files on disk (outside the asar) that the spawned child processes need:
# the built server + its node_modules (Nest, Prisma client + query engine), the prisma CLI
# and migrations, and the web build the server serves as the UI.
extraResources:
  - from: ../server/dist
    to: server/dist
  - from: ../server/node_modules
    to: server/node_modules
  - from: ../server/prisma
    to: server/prisma
  - from: ../server/package.json
    to: server/package.json
  - from: ../web/dist
    to: web

win:
  # Installer only. The portable target was dropped: it re-extracts the whole ~490 MB app to a
  # temp dir on every launch (slow), and its self-extractor stub proved flaky for this
  # spawn-heavy, no-asar app. The NSIS installer installs to a stable folder and is reliable.
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Present for later; building these needs a macOS host and (for warning-free) signing.
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
